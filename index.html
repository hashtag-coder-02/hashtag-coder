<img id="musicImage" src="photo4.jpg" style="float:right;"
      height ="250px" width="400px"  alt="Tap to listen">

<audio id="myMusic">
    <source src="my.music.mp3" type="audio/mpeg">
</audio>

<script>
const image = document.getElementById("musicImage");
const music = document.getElementById("myMusic");

image.addEventListener("click", function() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
});
</script>
